<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game starting page...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="full_portion">
            <div class="player1_display player_details" id="player1_display">
                <div class="player_name" id="player_name1">Player 1</div>
                <div class="color_choosen" id="color_choosen1">Color 1</div>
                <div class="game_progress" id="game_progress1"></div>
            </div>
            <div class="box_start" id="box_start">
                <button class="buttons" ></button>
                <button class="buttons" ></button>
                <button class="buttons" ></button>
                <button class="buttons" ></button>
                <button class="buttons" ></button>
                <button class="buttons" ></button>
                <button class="buttons" ></button>
                <button class="buttons" ></button>
                <button class="buttons" ></button>
            </div>
            <div class="player2_display player_details" id="player2_display">
                <div class="player_name" id="player_name2">Player 2</div>
                <div class="color_choosen" id="color_choosen2">Color 2</div>
                <div class="game_progress" id="game_progress2"></div>
            </div>
        </div>
        <div class="next_button">
            <button class="buttons_options" id="restart_button" title="restart the game">Restart</button>
            <button class="buttons_options" id="main_menu_button" title="go to main menu">Main menu</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
